[project]
name = "battery-asset-normalizer"
version = "0.1.0"
description = "Normalise battery asset telemetry into interval energy data"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Shiwang Jaiswal"}]
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
